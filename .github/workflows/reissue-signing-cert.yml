# Reissue the trust list signing certificate for the key already held in the
# signing token.
#
# Run this when the certificate and the signing key have drifted apart, or when
# the certificate is approaching expiry. It never touches the private key, so
# the signing identity is preserved — only the certificate is replaced.
#
# The new certificate is uploaded as an artifact. Download it and commit it as
# certs/root-signer.pem, otherwise the published trust anchor will no longer
# match what the token signs with and publish.yml will refuse to deploy.
name: Reissue Signing Certificate

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Which token to operate on'
        required: true
        default: 'softhsm'
        type: choice
        options:
          - softhsm
          - yubihsm
      subject:
        description: 'Certificate common name'
        required: false
        default: ''
      days:
        description: 'Validity in days'
        required: true
        default: '1095'
      apply:
        description: 'Write the new certificate into the token. Leave unchecked for a dry run.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signing-token
  cancel-in-progress: false

env:
  TRUST_DOMAIN: ${{ vars.TRUST_DOMAIN || 'trust.siros.org' }}

jobs:
  reissue:
    # Must be the Linux signer, not the org's macOS Xcode builder — both
    # carry the bare 'self-hosted' label.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - name: Install tsl-tool
        uses: sirosfoundation/g119612@v0.7.0

      - name: Configure persistent SoftHSM2
        if: inputs.signing_mode == 'softhsm'
        run: |
          set -euo pipefail
          SOFTHSM_CONF="${SOFTHSM_CONF_PATH:-/etc/softhsm/trust-lists.conf}"
          if [ ! -f "$SOFTHSM_CONF" ]; then
            echo "::error::SoftHSM2 config not found at $SOFTHSM_CONF"
            exit 1
          fi
          echo "SOFTHSM2_CONF=$SOFTHSM_CONF" >> "$GITHUB_ENV"

          PKCS11_MODULE="${SOFTHSM_MODULE_PATH:-}"
          if [ -z "$PKCS11_MODULE" ]; then
            for p in /usr/lib/softhsm/libsofthsm2.so /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so /usr/lib64/softhsm/libsofthsm2.so; do
              if [ -f "$p" ]; then PKCS11_MODULE="$p"; break; fi
            done
          fi

          echo "PKCS11_URI=pkcs11:module=${PKCS11_MODULE};pin=${SOFTHSM_PIN};token=${SOFTHSM_TOKEN_LABEL}" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_LABEL=${SOFTHSM_KEY_LABEL:-signing-key}" >> "$GITHUB_ENV"
          echo "PKCS11_CERT_LABEL=${SOFTHSM_CERT_LABEL:-signing-cert}" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_ID=${SOFTHSM_KEY_ID:-01}" >> "$GITHUB_ENV"
        env:
          SOFTHSM_CONF_PATH: ${{ vars.SOFTHSM_CONF_PATH }}
          SOFTHSM_MODULE_PATH: ${{ vars.SOFTHSM_MODULE_PATH }}
          SOFTHSM_PIN: ${{ secrets.SOFTHSM_PIN }}
          SOFTHSM_TOKEN_LABEL: ${{ vars.SOFTHSM_TOKEN_LABEL || 'trust-lists' }}
          SOFTHSM_KEY_LABEL: ${{ vars.SOFTHSM_KEY_LABEL }}
          SOFTHSM_CERT_LABEL: ${{ vars.SOFTHSM_CERT_LABEL }}
          SOFTHSM_KEY_ID: ${{ vars.SOFTHSM_KEY_ID }}

      - name: Configure YubiHSM2
        if: inputs.signing_mode == 'yubihsm'
        run: |
          set -euo pipefail
          echo "PKCS11_URI=pkcs11:module=${YUBIHSM_PKCS11_MODULE};pin=${YUBIHSM_PIN};token=${YUBIHSM_TOKEN_LABEL}" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_LABEL=${YUBIHSM_KEY_LABEL}" >> "$GITHUB_ENV"
          echo "PKCS11_CERT_LABEL=${YUBIHSM_CERT_LABEL}" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_ID=${YUBIHSM_KEY_ID}" >> "$GITHUB_ENV"
        env:
          YUBIHSM_PKCS11_MODULE: ${{ secrets.YUBIHSM_PKCS11_MODULE }}
          YUBIHSM_PIN: ${{ secrets.YUBIHSM_PIN }}
          YUBIHSM_TOKEN_LABEL: ${{ secrets.YUBIHSM_TOKEN_LABEL }}
          YUBIHSM_KEY_LABEL: ${{ secrets.YUBIHSM_KEY_LABEL }}
          YUBIHSM_CERT_LABEL: ${{ secrets.YUBIHSM_CERT_LABEL }}
          YUBIHSM_KEY_ID: ${{ secrets.YUBIHSM_KEY_ID }}

      # Record what is in the token before changing anything, so the run itself
      # documents whether the drift this workflow exists to fix was present.
      - name: Report current state
        run: |
          set -euo pipefail
          MODULE=$(echo "$PKCS11_URI" | sed -n 's/.*module=\([^;]*\).*/\1/p')
          TOKEN=$(echo "$PKCS11_URI" | sed -n 's/.*token=\([^;]*\).*/\1/p')
          PIN=$(echo "$PKCS11_URI" | sed -n 's/.*pin=\([^;]*\).*/\1/p')

          WORK=$(mktemp -d)
          echo "WORK=$WORK" >> "$GITHUB_ENV"

          pkcs11-tool --module "$MODULE" --token-label "$TOKEN" --login --pin "$PIN" \
            --read-object --type pubkey --label "$PKCS11_KEY_LABEL" -o "$WORK/key.der"
          openssl pkey -pubin -inform DER -in "$WORK/key.der" -outform DER -pubout > "$WORK/from-key.der"

          if pkcs11-tool --module "$MODULE" --token-label "$TOKEN" --login --pin "$PIN" \
               --read-object --type cert --label "$PKCS11_CERT_LABEL" -o "$WORK/cert.der" 2>/dev/null; then
            echo "Existing certificate:"
            openssl x509 -inform DER -in "$WORK/cert.der" -noout -subject -serial -dates
            openssl x509 -inform DER -in "$WORK/cert.der" -pubkey -noout \
              | openssl pkey -pubin -outform DER -pubout > "$WORK/from-cert.der"
            if cmp -s "$WORK/from-key.der" "$WORK/from-cert.der"; then
              echo "Certificate already matches the signing key."
            else
              echo "::warning::Certificate does NOT match the signing key — this is the drift being repaired."
            fi
          else
            echo "No certificate under label '$PKCS11_CERT_LABEL'."
          fi

      - name: Issue certificate
        run: |
          set -euo pipefail
          SUBJECT="${{ inputs.subject }}"
          if [ -z "$SUBJECT" ]; then
            SUBJECT="${TRUST_DOMAIN} Trust List Signer"
          fi

          # Without -cert-label the token is left untouched, which makes the
          # unchecked "apply" box a genuine dry run.
          CERT_LABEL_ARG=()
          if [ "${{ inputs.apply }}" = "true" ]; then
            CERT_LABEL_ARG=(-cert-label "$PKCS11_CERT_LABEL")
            echo "Writing the new certificate into the token."
          else
            echo "Dry run — generating the certificate without storing it."
          fi

          tsl-tool -selfsign-cert \
            -pkcs11-uri "$PKCS11_URI" \
            -key-label "$PKCS11_KEY_LABEL" \
            -key-id "$PKCS11_KEY_ID" \
            "${CERT_LABEL_ARG[@]}" \
            -subject "$SUBJECT" \
            -days "${{ inputs.days }}" \
            -output "$WORK/root-signer.pem"

          openssl x509 -in "$WORK/root-signer.pem" -noout -subject -serial -dates

      - name: Verify the new certificate matches the signing key
        run: |
          set -euo pipefail
          openssl x509 -in "$WORK/root-signer.pem" -pubkey -noout \
            | openssl pkey -pubin -outform DER -pubout > "$WORK/new-from-cert.der"
          if ! cmp -s "$WORK/from-key.der" "$WORK/new-from-cert.der"; then
            echo "::error::Reissued certificate still does not match the signing key."
            exit 1
          fi
          echo "New certificate matches the signing key."

      # Copy into the workspace first: uploading from an absolute path outside
      # it makes the artifact carry that path, and `gh run download` then
      # refuses it as path traversal.
      - name: Stage certificate for upload
        run: cp "$WORK/root-signer.pem" root-signer.pem

      - uses: actions/upload-artifact@v7
        with:
          name: root-signer-pem
          path: root-signer.pem
          if-no-files-found: error

      - name: Next steps
        run: |
          echo "Download the root-signer-pem artifact and commit it as certs/root-signer.pem."
          echo "publish.yml verifies the published anchor against the token certificate,"
          echo "so the next publish will fail until that is done."
