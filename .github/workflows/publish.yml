name: Publish Trust Lists

on:
  push:
    branches: [main]
    paths:
      - 'lists/**'
      - 'pipelines/**'
      - 'templates/**'
      - 'static/**'
      - 'scripts/**'
      # The published trust anchor. Changing it without republishing leaves
      # the site serving lists signed under the previous certificate.
      - 'certs/**'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Signing mode'
        required: true
        default: 'softhsm'
        type: choice
        options:
          - dev
          - softhsm
          - yubihsm
  schedule:
    # Rebuild every 12 hours (for external TSL refresh)
    - cron: '0 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  OUTPUT_DIR: dist
  TRUST_DOMAIN: ${{ vars.TRUST_DOMAIN || 'trust.siros.org' }}

jobs:
  build:
    # dev = ephemeral SoftHSM on GitHub-hosted runner; softhsm/yubihsm = self-hosted runner
    # 'self-hosted' alone also matches the org's macOS Xcode builder, which
    # has no signing token. Pin to the Linux signer explicitly.
    runs-on: ${{ fromJSON((inputs.signing_mode == 'dev' || (!inputs.signing_mode && vars.DEFAULT_SIGNING_MODE == 'dev')) && '"ubuntu-latest"' || '["self-hosted","Linux","X64"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tsl-tool
        uses: sirosfoundation/g119612@v0.7.0

      - name: Resolve signing mode
        id: mode
        run: |
          MODE="${{ inputs.signing_mode || vars.DEFAULT_SIGNING_MODE || 'dev' }}"
          echo "signing_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "SIGNING_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Signing mode: $MODE"

      # ── dev: SoftHSM2 on GitHub-hosted runner ──────────────────────
      # If SIGNING_KEY_PEM secret is set, imports the stable root key
      # from the secret and the matching cert from certs/root-signer.pem.
      # Otherwise falls back to generating an ephemeral key pair.
      - name: Setup SoftHSM2 (dev)
        if: steps.mode.outputs.signing_mode == 'dev'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y softhsm2 opensc

          TOKEN_DIR=$(mktemp -d)
          cat > "$TOKEN_DIR/softhsm2.conf" <<CONF
          directories.tokendir = $TOKEN_DIR
          objectstore.backend = file
          log.level = INFO
          slots.removable = true
          CONF
          export SOFTHSM2_CONF="$TOKEN_DIR/softhsm2.conf"

          softhsm2-util --init-token --free \
            --label "trust-lists" \
            --so-pin 5678 \
            --pin 1234

          for p in /usr/lib/softhsm/libsofthsm2.so /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so; do
            if [ -f "$p" ]; then PKCS11_MODULE="$p"; break; fi
          done

          if [ -n "${SIGNING_KEY_PEM:-}" ] && [ -f certs/root-signer.pem ]; then
            echo "Importing stable root signing key from secret"
            KEY_FILE=$(mktemp)
            trap 'rm -f "$KEY_FILE"' EXIT
            printf '%s\n' "$SIGNING_KEY_PEM" > "$KEY_FILE"

            softhsm2-util --import "$KEY_FILE" \
              --token "trust-lists" \
              --pin 1234 \
              --label "signing-key" \
              --id 01

            pkcs11-tool --module "$PKCS11_MODULE" \
              --token-label "trust-lists" \
              --login --pin 1234 \
              --write-object certs/root-signer.pem --type cert \
              --id 01 --label "signing-cert"
          else
            echo "No SIGNING_KEY_PEM secret — generating ephemeral key pair"
            pkcs11-tool --module "$PKCS11_MODULE" \
              --token-label "trust-lists" \
              --login --pin 1234 \
              --keypairgen --key-type ec:prime256v1 \
              --id 01 --label "signing-key"

            # Issue the certificate for the key just generated in the token.
            # "openssl req -x509 -newkey" would generate its own key pair, so
            # the certificate would describe a key the token does not hold and
            # every signature would be unverifiable — silently.
            tsl-tool -selfsign-cert \
              -pkcs11-uri "pkcs11:module=${PKCS11_MODULE};pin=1234;token=trust-lists" \
              -key-label "signing-key" \
              -key-id 01 \
              -cert-label "signing-cert" \
              -subject "${TRUST_DOMAIN} Trust List Signer (Dev)" \
              -days 365 \
              -output "$TOKEN_DIR/cert.pem"

            # In this mode the ephemeral certificate is the trust anchor, so
            # publish it rather than the committed one.
            echo "EPHEMERAL_ROOT_SIGNER=$TOKEN_DIR/cert.pem" >> "$GITHUB_ENV"
          fi

          echo "PKCS11_URI=pkcs11:module=${PKCS11_MODULE};pin=1234;token=trust-lists" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_LABEL=signing-key" >> "$GITHUB_ENV"
          echo "PKCS11_CERT_LABEL=signing-cert" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_ID=01" >> "$GITHUB_ENV"
          echo "SOFTHSM2_CONF=$TOKEN_DIR/softhsm2.conf" >> "$GITHUB_ENV"
        env:
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}

      # ── softhsm: persistent SoftHSM2 on self-hosted runner ────────
      - name: Configure persistent SoftHSM2
        if: steps.mode.outputs.signing_mode == 'softhsm'
        run: |
          set -euo pipefail
          SOFTHSM_CONF="${SOFTHSM_CONF_PATH:-/etc/softhsm/trust-lists.conf}"
          if [ ! -f "$SOFTHSM_CONF" ]; then
            echo "::error::SoftHSM2 config not found at $SOFTHSM_CONF — run scripts/setup-softhsm-runner.sh on the runner host first"
            exit 1
          fi

          echo "SOFTHSM2_CONF=$SOFTHSM_CONF" >> "$GITHUB_ENV"

          # Read PKCS#11 module path from runner env or default
          PKCS11_MODULE="${SOFTHSM_MODULE_PATH:-}"
          if [ -z "$PKCS11_MODULE" ]; then
            for p in /usr/lib/softhsm/libsofthsm2.so /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so /usr/lib64/softhsm/libsofthsm2.so; do
              if [ -f "$p" ]; then PKCS11_MODULE="$p"; break; fi
            done
          fi

          echo "PKCS11_URI=pkcs11:module=${PKCS11_MODULE};pin=${SOFTHSM_PIN};token=${SOFTHSM_TOKEN_LABEL}" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_LABEL=${SOFTHSM_KEY_LABEL:-signing-key}" >> "$GITHUB_ENV"
          echo "PKCS11_CERT_LABEL=${SOFTHSM_CERT_LABEL:-signing-cert}" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_ID=${SOFTHSM_KEY_ID:-01}" >> "$GITHUB_ENV"
        env:
          SOFTHSM_CONF_PATH: ${{ vars.SOFTHSM_CONF_PATH }}
          SOFTHSM_MODULE_PATH: ${{ vars.SOFTHSM_MODULE_PATH }}
          SOFTHSM_PIN: ${{ secrets.SOFTHSM_PIN }}
          SOFTHSM_TOKEN_LABEL: ${{ vars.SOFTHSM_TOKEN_LABEL || 'trust-lists' }}
          SOFTHSM_KEY_LABEL: ${{ vars.SOFTHSM_KEY_LABEL }}
          SOFTHSM_CERT_LABEL: ${{ vars.SOFTHSM_CERT_LABEL }}
          SOFTHSM_KEY_ID: ${{ vars.SOFTHSM_KEY_ID }}

      # ── yubihsm: YubiHSM2 on self-hosted runner ──────────────────
      - name: Configure YubiHSM2 signing environment
        if: steps.mode.outputs.signing_mode == 'yubihsm'
        run: |
          set -euo pipefail
          echo "PKCS11_URI=pkcs11:module=${YUBIHSM_PKCS11_MODULE};pin=${YUBIHSM_PIN};token=${YUBIHSM_TOKEN_LABEL}" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_LABEL=${YUBIHSM_KEY_LABEL}" >> "$GITHUB_ENV"
          echo "PKCS11_CERT_LABEL=${YUBIHSM_CERT_LABEL}" >> "$GITHUB_ENV"
          echo "PKCS11_KEY_ID=${YUBIHSM_KEY_ID}" >> "$GITHUB_ENV"
        env:
          YUBIHSM_PKCS11_MODULE: ${{ secrets.YUBIHSM_PKCS11_MODULE }}
          YUBIHSM_PIN: ${{ secrets.YUBIHSM_PIN }}
          YUBIHSM_TOKEN_LABEL: ${{ secrets.YUBIHSM_TOKEN_LABEL }}
          YUBIHSM_KEY_LABEL: ${{ secrets.YUBIHSM_KEY_LABEL }}
          YUBIHSM_CERT_LABEL: ${{ secrets.YUBIHSM_CERT_LABEL }}
          YUBIHSM_KEY_ID: ${{ secrets.YUBIHSM_KEY_ID }}

      # ── Verify PKCS#11 token ──────────────────────────────────────
      - name: Verify PKCS#11 token objects
        if: steps.mode.outputs.signing_mode != 'dev'
        run: |
          set -euo pipefail
          MODULE=$(echo "$PKCS11_URI" | sed -n 's/.*module=\([^;]*\).*/\1/p')
          TOKEN=$(echo "$PKCS11_URI" | sed -n 's/.*token=\([^;]*\).*/\1/p')
          echo "Module: $MODULE"
          echo "Token: $TOKEN"
          echo "Key label: $PKCS11_KEY_LABEL (ID: $PKCS11_KEY_ID)"
          echo "Cert label: $PKCS11_CERT_LABEL (ID: $PKCS11_KEY_ID)"
          pkcs11-tool --module "$MODULE" --token-label "$TOKEN" --list-objects 2>&1 || true

      # ── Guard: the certificate must belong to the signing key ────
      # If these disagree, signing still succeeds and every published list
      # is unverifiable by anyone holding the certificate. That shipped
      # undetected for months, so fail the build here instead.
      - name: Verify signing certificate matches signing key
        run: |
          set -euo pipefail
          MODULE=$(echo "$PKCS11_URI" | sed -n 's/.*module=\([^;]*\).*/\1/p')
          TOKEN=$(echo "$PKCS11_URI" | sed -n 's/.*token=\([^;]*\).*/\1/p')
          PIN=$(echo "$PKCS11_URI" | sed -n 's/.*pin=\([^;]*\).*/\1/p')

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          pkcs11-tool --module "$MODULE" --token-label "$TOKEN" --login --pin "$PIN" \
            --read-object --type pubkey --label "$PKCS11_KEY_LABEL" -o "$WORK/key.der"
          pkcs11-tool --module "$MODULE" --token-label "$TOKEN" --login --pin "$PIN" \
            --read-object --type cert --label "$PKCS11_CERT_LABEL" -o "$WORK/cert.der"

          openssl pkey -pubin -inform DER -in "$WORK/key.der" -outform DER -pubout > "$WORK/from-key.der"
          openssl x509 -inform DER -in "$WORK/cert.der" -pubkey -noout \
            | openssl pkey -pubin -outform DER -pubout > "$WORK/from-cert.der"

          if ! cmp -s "$WORK/from-key.der" "$WORK/from-cert.der"; then
            echo "::error::Certificate '$PKCS11_CERT_LABEL' does not belong to key '$PKCS11_KEY_LABEL'."
            echo "::error::Signatures would verify against nothing. Reissue with:"
            echo "::error::  tsl-tool -selfsign-cert -pkcs11-uri ... -cert-label $PKCS11_CERT_LABEL -subject '...' -output certs/root-signer.pem"
            exit 1
          fi
          echo "Signing certificate matches the signing key."

          # The published trust anchor must be that same certificate.
          ANCHOR=""
          if [ -n "${EPHEMERAL_ROOT_SIGNER:-}" ] && [ -f "$EPHEMERAL_ROOT_SIGNER" ]; then
            ANCHOR="$EPHEMERAL_ROOT_SIGNER"
          elif [ -f certs/root-signer.pem ]; then
            ANCHOR=certs/root-signer.pem
          fi
          if [ -n "$ANCHOR" ]; then
            openssl x509 -in "$ANCHOR" -outform DER > "$WORK/anchor.der"
            if ! cmp -s "$WORK/anchor.der" "$WORK/cert.der"; then
              echo "::error::Published trust anchor ($ANCHOR) is not the certificate in the token."
              exit 1
            fi
            echo "Published trust anchor matches the token certificate."
          fi

      # ── Run all .pipeline.yaml files ────────────────────────────
      - name: Run trust list pipelines
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          export OUTPUT_DIR PKCS11_URI PKCS11_KEY_LABEL PKCS11_CERT_LABEL PKCS11_KEY_ID

          for dir in lists/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")

            if [ -f "$dir/.pipeline.yaml" ]; then
              template="$dir/.pipeline.yaml"
            else
              echo "Skipping $name — no .pipeline.yaml"
              continue
            fi

            echo "::group::Publishing $name"
            pipeline=$(mktemp --suffix=.yaml)
            LIST_DIR="$dir" envsubst < "$template" > "$pipeline"
            echo "Pipeline content:"
            cat "$pipeline"
            tsl-tool "$pipeline"
            rm -f "$pipeline"
            echo "::endgroup::"
          done

      - name: Run custom pipelines
        run: |
          set -euo pipefail
          export OUTPUT_DIR PKCS11_URI PKCS11_KEY_LABEL PKCS11_CERT_LABEL PKCS11_KEY_ID
          for p in pipelines/*.yaml; do
            [ -f "$p" ] || continue
            echo "::group::Running $(basename "$p")"
            pipeline=$(mktemp --suffix=.yaml)
            envsubst < "$p" > "$pipeline"
            tsl-tool "$pipeline"
            rm -f "$pipeline"
            echo "::endgroup::"
          done

      # ── Build static site ─────────────────────────────────────────
      - name: Build landing page
        run: |
          set -euo pipefail

          # Copy static assets
          if [ -d static ]; then
            cp -r static "$OUTPUT_DIR/static"
          fi

          # Publish root signing certificate for out-of-band trust anchor
          # discovery. This must be the certificate the token actually signs
          # with, otherwise the published lists verify against nothing.
          if [ -n "${EPHEMERAL_ROOT_SIGNER:-}" ] && [ -f "$EPHEMERAL_ROOT_SIGNER" ]; then
            cp "$EPHEMERAL_ROOT_SIGNER" "$OUTPUT_DIR/root-signer.pem"
          elif [ -f certs/root-signer.pem ]; then
            cp certs/root-signer.pem "$OUTPUT_DIR/root-signer.pem"
          fi

          # Write CNAME from configured domain
          echo "$TRUST_DOMAIN" > "$OUTPUT_DIR/CNAME"

          # Generate index page from template
          if [ -f scripts/build-index.sh ]; then
            bash scripts/build-index.sh "$OUTPUT_DIR" "$TRUST_DOMAIN"
          fi

          # Generate status.json for external monitoring (e.g. instatus.com)
          bash scripts/build-status.sh "$OUTPUT_DIR"
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
